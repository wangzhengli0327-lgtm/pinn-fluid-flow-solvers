name: 代码质量检查

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Python 语法与工具检查
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 检查 Python 语法
        run: python -m compileall -q src scripts task1_burgers_exact.py task2_burgers_forward.py task3_cavity_Re100.py task4_burgers_inverse.py
      - name: 检查数据工具入口
        run: |
          python scripts/prepare_burgers_data.py --help
          python scripts/validate_data.py --help
