name: 缺陷报告
description: 报告可以稳定复现的程序错误
title: "[缺陷] "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: "感谢你帮助改进项目。请勿提交访问令牌、私有数据或个人敏感信息。"
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清楚说明实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小复现命令、使用的任务和运行模式。
      placeholder: |
        1. 安装依赖
        2. 运行……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请填写操作系统、Python、PyTorch、CPU 或 GPU 信息。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可粘贴必要日志或拖入截图，请先移除敏感信息。
      render: shell
