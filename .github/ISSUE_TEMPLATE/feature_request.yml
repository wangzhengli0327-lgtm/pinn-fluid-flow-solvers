name: 功能建议
description: 提议新的算法、任务、实验或工程改进
title: "[建议] "
labels:
  - "enhancement"
body:
  - type: textarea
    id: motivation
    attributes:
      label: 背景与目标
      description: 这个建议要解决什么问题，适用于什么场景？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述预期接口、算法或使用方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如果考虑过其他实现方式，请一并说明。
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与实现
      options:
        - label: 我愿意讨论或提交合并请求协助实现
